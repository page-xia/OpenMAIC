# MAIC (OpenMAIC) production site for maic.omnisource.xin
#
# Runs alongside the existing omnisource.xin watchtower stack on the same
# server: this file owns the maic.* vhost, nginx proxies to the Next.js
# container on 127.0.0.1:3000, and PostgreSQL runs in its own container.
#
# Self-contained on purpose: the Upgrade map uses a maic-specific variable name
# so this file does not depend on the map declared in omnisource.conf.
#
# Streaming notes (Next.js + AI SDK):
#   - SSE (`/api/chat`, agent streams) needs `proxy_buffering off` and a long
#     read timeout, otherwise tokens arrive in bursts or the stream is cut.
#   - `proxy_read_timeout 3600s` covers the long-lived agent connections.
map $http_upgrade $maic_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name maic.omnisource.xin www.maic.omnisource.xin;

    # Left in place as the ACME hook: harmless today (the certificate is a
    # manually uploaded DigiCert one), but it is what makes a switch back to
    # certbot work without touching this file.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` must ride on the listen directive: the standalone `http2 on;`
    # directive needs nginx >= 1.25.1 and this server runs 1.24.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    # www. is listed because the DigiCert certificate's SAN covers it; the
    # A record for www.maic still has to be added in DNS before it resolves.
    server_name maic.omnisource.xin www.maic.omnisource.xin;

    # Aliyun-issued DigiCert certificate for this domain, uploaded manually and
    # valid until 2026-12-08. To renew, download a new pair from Aliyun and
    # overwrite both files, then `nginx -s reload` — there is no ACME renewal
    # for this domain (see .deploy/README.md).
    ssl_certificate     /etc/nginx/ssl/maic.omnisource.xin.pem;
    ssl_certificate_key /etc/nginx/ssl/maic.omnisource.xin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Courseware uploads (PPTX/PDF/ZIP) and material imports go through here.
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1k;
    # Never gzip a proxied response: it delays SSE flushes.
    gzip_proxied off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $maic_connection_upgrade;

        # Streaming (SSE) path: no buffering, no response chunking.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }
}
