# MAIC (OpenMAIC) production site for www.sylp.org.cn
#
# Second MAIC server (47.116.57.106). Same shape as .deploy/maic-nginx.conf:
# nginx terminates TLS, proxies to the Next.js container on 127.0.0.1:3000,
# PostgreSQL runs in its own container (maic-postgres, not exposed).
#
# Differences from the first server (47.116.20.229):
#   - nginx is 1.30 here, so `http2 on;` (the standalone directive needs
#     >= 1.25.1) replaces `listen 443 ssl http2`.
#   - The Aliyun-issued DigiCert certificate SANs www.sylp.org.cn and
#     sylp.org.cn, so both names are served by the same vhost.
#
# Streaming notes (Next.js + AI SDK):
#   - SSE (`/api/chat`, agent streams) needs `proxy_buffering off` and a long
#     read timeout, otherwise tokens arrive in bursts or the stream is cut.
#   - `proxy_read_timeout 3600s` covers the long-lived agent connections.
map $http_upgrade $maic_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;
    server_name www.sylp.org.cn sylp.org.cn;

    # Left in place as the ACME hook: harmless today (the certificate is a
    # manually uploaded DigiCert one), but it is what makes a switch back to
    # certbot work without touching this file.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.sylp.org.cn sylp.org.cn;

    # Aliyun-issued DigiCert certificate, uploaded manually. To renew, download
    # a new pair from the Aliyun console and overwrite both files, then
    # `nginx -t && nginx -s reload` (no ACME renewal for this domain).
    ssl_certificate     /etc/nginx/ssl/www.sylp.org.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.sylp.org.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Courseware uploads (PPTX/PDF/ZIP) and material imports go through here.
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1k;
    # Never gzip a proxied response: it delays SSE flushes.
    gzip_proxied off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $maic_connection_upgrade;

        # Streaming (SSE) path: no buffering, no response chunking.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }
}
